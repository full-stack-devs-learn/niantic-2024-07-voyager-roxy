<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.3/united/bootstrap.min.css"
          integrity="sha512-bDf5pNGht0HBv1tNSyB06LQ4D+5IV4xpCmAFKORMIQi57c8mq96hg2Wa03//JNjHEjEai1qV+ZOUcwuy70j02A=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/styles.css">

</head>
<body>

<div th:replace="fragments/header.html :: nav"></div>
<main class="container mt-4">

    <h4>Product Details</h4>
    <table class="table table-striped">
        <tr>
            <th><strong>Product ID</strong></th> <td><span th:text="${product.productId}"></span></td>
        </tr>
        <tr>
            <th><strong>Category Name</strong></th> <td><span th:text="${categoryName}"></span></td>
        </tr>
        <tr>
            <th><strong>Product</strong></th> <td><span th:text="${product.productName}"></span></td>
        </tr>
        <tr>
            <th><strong>Price</strong></th> <td><span th:text="${#numbers.formatCurrency(product.unitPrice)}"></span></td>
        </tr>
        <tr>
            <th><strong>Quantity Per Unit</strong></th> <td><span th:text="${product.quantityPerUnit}"></span></td>
        </tr>
        <tr>
            <th><strong>Units In Stock</strong></th> <td><span th:text="${product.unitsInStock}"></span></td>
        </tr>
        <tr>
            <th><strong>Units On Order</strong></th> <td><span th:text="${product.unitsOnOrder}"></span></td>
        </tr>

        <tr>
            <th><strong>Reorder Level</strong></th> <td><span th:text="${product.reorderLevel}"></span></td>
        </tr>
    </table>
</main>
</body>
</html>

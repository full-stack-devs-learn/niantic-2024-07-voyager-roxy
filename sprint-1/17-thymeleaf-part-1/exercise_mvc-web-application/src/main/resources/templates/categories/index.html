<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>All Categories</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.3/united/bootstrap.min.css"
          integrity="sha512-bDf5pNGht0HBv1tNSyB06LQ4D+5IV4xpCmAFKORMIQi57c8mq96hg2Wa03//JNjHEjEai1qV+ZOUcwuy70j02A=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/styles.css">

</head>
<body>

<div th:replace="fragments/header.html :: nav"></div>

<main class="container mt-4">
<h1>Categories</h1>

    <a th:href="@{/categories/add}" class="btn btn-outline-dark">New</a>
<table class="table table-striped">
    <thead>
    <tr>
        <th>Id</th>
        <th>Category</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="category:${categories}">
        <td th:text="${category.categoryId}"></td>
        <td><a th:href="@{|/categories/${category.categoryId}|}" th:text="${category.categoryName}|"></a></td>
        <td><a th:href="@{|/products?catId=${category.categoryId}|}" class="btn btn-outline-info">Products</a></td>
    </tr>
    </tbody>
</table>
</main>
</body>
</html>
